[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "apache-airflow-providers-uape"
version = "0.0.1"
description = "Dev-only UAPE: parallelization advisory CLI and JSON HTTP API for external apps (read-only)."
readme = "README.txt"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "apache-airflow>=3.0.0",
]

[project.urls]
Documentation = "https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.uape.get_provider_info:get_provider_info"

# Load ``AirflowPlugin`` on every process (not gated by ``[core] lazy_discover_providers``).
# Without this, provider-only ``plugins`` in ``get_provider_info`` are skipped when lazy is True.
[project.entry-points."airflow.plugins"]
uape_advisory = "airflow.providers.uape.plugins.uape_plugin:UapeAdvisoryPlugin"

[tool.flit.module]
name = "airflow.providers.uape"
