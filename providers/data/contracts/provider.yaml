---
package-name: apache-airflow-providers-data-contracts
name: Data contracts
description: |
  `Data contracts <https://datacontract.com/>`__ enforcement against catalog definitions
  (DataHub GMS or catalog-lite YAML), for producer/consumer DAG patterns described in AIP-07.

state: not-ready
lifecycle: incubation
source-date-epoch: 1774299332
versions:
  - 1.0.0

integrations:
  - integration-name: Data contracts
    external-doc-url: https://datahubproject.io/
    tags: [service]

operators:
  - integration-name: Data contracts
    python-modules:
      - airflow.providers.data.contracts.operators.contract_validate
      - airflow.providers.data.contracts.operators.contract_publish
      - airflow.providers.data.contracts.operators.contract_breach_guard

sensors:
  - integration-name: Data contracts
    python-modules:
      - airflow.providers.data.contracts.sensors.contract_ready

hooks:
  - integration-name: Data contracts
    python-modules:
      - airflow.providers.data.contracts.hooks.base_catalog
      - airflow.providers.data.contracts.hooks.datahub
      - airflow.providers.data.contracts.hooks.local_yaml

connection-types:
  - hook-class-name: airflow.providers.data.contracts.hooks.datahub.DataHubCatalogHook
    connection-type: datahub
    ui-field-behaviour:
      hidden-fields: []
      relabeling:
        host: GMS base URL
        password: Token
      placeholders:
        host: "http://localhost:8080"
    conn-fields: {}
  - hook-class-name: airflow.providers.data.contracts.hooks.local_yaml.YamlDataContractHook
    connection-type: data_contract_yaml
    ui-field-behaviour:
      hidden-fields: []
      relabeling: {}
      placeholders: {}
    conn-fields: {}
