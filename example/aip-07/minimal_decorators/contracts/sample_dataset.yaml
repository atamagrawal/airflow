# Minimal local contract — no freshness/SLA clauses so validation is deterministic.
contract_id: sample-dataset-v1
dataset_urn: "urn:example:sample_dataset"
dataset_name: sample_dataset
version: 1
status: ACTIVE

schema:
  - name: id
    type: STRING
    nullable: false
  - name: amount
    type: FLOAT
    nullable: false

min_row_count: 1

schema_compatibility: BACKWARD
