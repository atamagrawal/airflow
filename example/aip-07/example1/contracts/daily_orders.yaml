# ── AIP-07 data contract: daily_orders ──────────────────────────────
# This file is consumed by the YamlDataContractHook (connection type
# "data_contract_yaml").  Each field maps 1-to-1 to DataContract attrs.

contract_id: daily-orders-v1
dataset_urn: "urn:li:dataset:(urn:li:dataPlatform:postgres,warehouse.daily_orders,PROD)"
dataset_name: daily_orders
version: 1
status: ACTIVE

producer_team: data-eng
producer_dag_id: aip07_producer
consumer_teams:
  - analytics
  - ml-features
consumer_dag_ids:
  - aip07_consumer

# ── Schema ──────────────────────────────────────────────────────────
schema:
  - name: order_id
    type: STRING
    nullable: false
    primary_key: true
    description: Unique order identifier
  - name: customer_id
    type: STRING
    nullable: false
    description: Customer who placed the order
  - name: order_date
    type: STRING
    nullable: false
    partition_key: true
    description: ISO-8601 date the order was placed
  - name: amount
    type: FLOAT
    nullable: false
    description: Total order amount in USD
  - name: status
    type: STRING
    nullable: true
    description: "Order status: pending, shipped, delivered"

schema_compatibility: BACKWARD

# ── Quality rules ───────────────────────────────────────────────────
min_row_count: 1
max_row_count: 1000000
freshness_max_age_minutes: 1440   # data must be less than 24 h old
sla_completion_minutes: 60        # producer DAG must finish within 1 h

tags:
  - aip-07-example
  - daily
